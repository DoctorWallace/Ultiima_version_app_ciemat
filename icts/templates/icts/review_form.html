{% extends "base_icts.html" %}
{% block title %}Revisar propuesta{% endblock %}
{% block content %}
<div class="container mt-4">
  <h2>Revisión: {{ obj.title }}</h2>
  <p class="text-muted">Solicitante: {{ obj.applicant.get_username }} · Estado: {{ obj.get_status_display }}</p>

  <form method="post" class="card p-3">
    {% csrf_token %}
    <label class="form-label">Decisión</label>
    <select name="decision" class="form-select mb-3">
      {% for k,v in review.DECISION %}
        <option value="{{ k }}" {% if review.decision == k %}selected{% endif %}>{{ v }}</option>
      {% endfor %}
    </select>
    <label class="form-label">Comentarios</label>
    <textarea name="comments" rows="5" class="form-control mb-3">{{ review.comments }}</textarea>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" href="{% url 'icts:reviewer_inbox' %}">Volver</a>
    </div>
  </form>
</div>
{% endblock %}
