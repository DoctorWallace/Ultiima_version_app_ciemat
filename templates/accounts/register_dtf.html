{% extends "base_dtf.html" %}
{% block title %}Registro · Σ SIGMA DTF{% endblock %}
{% block page_title %}Registro · Σ SIGMA DTF{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:auto;">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top:1rem; display:flex; gap:.5rem;">
      <button class="cta" type="submit">Crear cuenta</button>
      <a class="cta" style="background:var(--accent)" href="{% url 'accounts:login_dtf' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
