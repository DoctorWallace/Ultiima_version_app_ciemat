{% extends "base_dtf.html" %}
{% block title %}Nueva solicitud{% endblock %}
{% block page_title %}Nueva solicitud{% endblock %}
{% block content %}
<div class="card" style="max-width:900px;">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div style="margin-top:1rem;">
      <button class="cta" type="submit">Enviar</button>
      <a class="cta" style="background:var(--accent)" href="{% url 'sigmalab:mis-solicitudes' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
